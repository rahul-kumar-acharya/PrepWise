<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <radialGradient id="indigoGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="violetGlow" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#indigoGlow)" />
  <rect width="1200" height="630" fill="url(#violetGlow)" />

  <!-- Subtle Grid Overlay -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
    <path d="M 0 70 H 1200 M 0 140 H 1200 M 0 210 H 1200 M 0 280 H 1200 M 0 350 H 1200 M 0 420 H 1200 M 0 490 H 1200 M 0 560 H 1200" />
    <path d="M 120 0 V 630 M 240 0 V 630 M 360 0 V 630 M 480 0 V 630 M 600 0 V 630 M 720 0 V 630 M 840 0 V 630 M 960 0 V 630 M 1080 0 V 630" />
  </g>

  <!-- Left Content Column -->
  <g transform="translate(80, 75)">
    <!-- Logo -->
    <rect width="52" height="52" rx="16" fill="url(#iconGrad)" />
    <text x="26" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle">PW</text>
    <text x="70" y="37" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="-1">
      <tspan fill="#6366F1">Prep</tspan><tspan fill="#FFFFFF">Wise</tspan>
    </text>

    <!-- Tag Pill -->
    <g transform="translate(0, 90)">
      <rect width="250" height="32" rx="16" fill="#1E1B4B" stroke="#4F46E5" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="20" cy="16" r="4" fill="#6366F1" />
      <text x="34" y="21" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#A5B4FC" letter-spacing="1.5">INTERVIEW PREPARATION</text>
    </g>

    <!-- Headline -->
    <g transform="translate(0, 170)">
      <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" letter-spacing="-1.5">
        Master the
      </text>
      <text y="60" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="url(#brandGrad)" letter-spacing="-1.5">
        Interview Game.
      </text>
    </g>

    <!-- Description -->
    <text y="295" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#94A3B8">
      <tspan x="0" dy="0">Interactive domain-specific roadmaps, STAR behavioral</tspan>
      <tspan x="0" dy="26">guides, and practical coding challenge solutions.</tspan>
    </text>

    <!-- Tech Domain Badges -->
    <g transform="translate(0, 365)">
      <rect x="0" y="0" width="80" height="32" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="40" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#E2E8F0" text-anchor="middle">React</text>

      <rect x="92" y="0" width="88" height="32" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="136" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#E2E8F0" text-anchor="middle">Python</text>

      <rect x="192" y="0" width="88" height="32" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="236" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#E2E8F0" text-anchor="middle">Node.js</text>

      <rect x="292" y="0" width="80" height="32" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="332" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#E2E8F0" text-anchor="middle">Java</text>

      <rect x="384" y="0" width="80" height="32" rx="8" fill="#1E293B" stroke="#334155" />
      <text x="424" y="20" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#E2E8F0" text-anchor="middle">Cloud</text>
    </g>

    <!-- Author Attribution -->
    <text y="465" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#64748B" letter-spacing="1">
      BY ACHARYAWORKS (RAHUL KUMAR ACHARYA)
    </text>
  </g>

  <!-- Right Visual: Code Editor UI Card -->
  <g transform="translate(630, 85)">
    <rect width="490" height="460" rx="24" fill="#1E1E1E" stroke="url(#cardBorder)" stroke-width="2" />

    <!-- Window Bar -->
    <rect width="490" height="48" rx="24" fill="#2D2D2D" />
    <rect y="24" width="490" height="24" fill="#2D2D2D" />

    <circle cx="28" cy="24" r="6" fill="#FF5F56" />
    <circle cx="48" cy="24" r="6" fill="#FFBD2E" />
    <circle cx="68" cy="24" r="6" fill="#27C93F" />

    <text x="96" y="28" font-family="monospace" font-weight="700" font-size="12" fill="#6B7280">solution.js</text>

    <!-- Code Snippet -->
    <g transform="translate(32, 85)" font-family="Consolas, Monaco, 'Courier New', monospace" font-size="14">
      <text y="0"><tspan fill="#F472B6">function</tspan> <tspan fill="#60A5FA">twoSum</tspan><tspan fill="#94A3B8">(nums, target) {</tspan></text>
      <text y="28" x="18"><tspan fill="#F472B6">const</tspan> <tspan fill="#E2E8F0">map =</tspan> <tspan fill="#F472B6">new</tspan> <tspan fill="#60A5FA">Map</tspan><tspan fill="#94A3B8">();</tspan></text>
      <text y="56" x="18"><tspan fill="#F472B6">for</tspan> <tspan fill="#94A3B8">(</tspan><tspan fill="#F472B6">let</tspan> <tspan fill="#E2E8F0">i = 0; i &lt; nums.length; i++) {</tspan></text>
      <text y="84" x="36"><tspan fill="#F472B6">const</tspan> <tspan fill="#E2E8F0">comp = target - nums[i];</tspan></text>
      <text y="112" x="36"><tspan fill="#F472B6">if</tspan> <tspan fill="#94A3B8">(map.has(comp)) {</tspan></text>
      <text y="140" x="54"><tspan fill="#F472B6">return</tspan> <tspan fill="#94A3B8">[map.get(comp), i];</tspan></text>
      <text y="168" x="36"><tspan fill="#94A3B8">}</tspan></text>
      <text y="196" x="36"><tspan fill="#E2E8F0">map.set(nums[i], i);</tspan></text>
      <text y="224" x="18"><tspan fill="#94A3B8">}</tspan></text>
      <text y="252"><tspan fill="#94A3B8">}</tspan></text>
    </g>

    <!-- Execution Status Bar -->
    <line x1="0" y1="390" x2="490" y2="390" stroke="#334155" stroke-width="1" />
    <g transform="translate(32, 422)">
      <circle cx="10" cy="-4" r="8" fill="#10B981" />
      <path d="M 6 -4 L 9 -1 L 14 -7" fill="none" stroke="#FFFFFF" stroke-width="2" />
      <text x="26" y="0" font-family="system-ui, sans-serif" font-weight="700" font-size="14" fill="#34D399">Accepted</text>

      <text x="320" y="0" font-family="monospace" font-size="12" fill="#64748B">Runtime: 58 ms</text>
    </g>
  </g>
</svg>
